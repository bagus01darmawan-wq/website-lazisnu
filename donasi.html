<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAZISNU MWC NU Kecamatan Paninggaran — Donasi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="situs-header">
    <div class="lebar">
      <a class="merek" href="index.html">LAZISNU <span>Paninggaran</span></a>
      <nav aria-label="Navigasi utama">
        <a href="index.html">Beranda</a>
        <a href="penyaluran.html">Penyaluran</a>
        <a href="donasi.html" class="aktif">Donasi</a>
        <a href="tentang.html">Tentang</a>
      </nav>
      <button type="button" id="tombol-tema" class="tombol-tema" aria-pressed="false">Mode Gelap</button>
    </div>
  </header>

  <main class="lebar">
    <!-- T4: kanal donasi + label transparan (AC-04, keputusan HOTL) disuntikkan generator
         dari database (tabel konten_halaman, B6) — repo tidak memuat data lembaga. -->
    <section aria-labelledby="judul-donasi">
      <h1 id="judul-donasi">Cara Donasi</h1>
      <div id="kanal-donasi">
        <h2>Rekening</h2>
        <p>{{donasi_kanal}}</p>
      </div>
      <!-- Slot QRIS (putusan HOTL 2026-08-12): tampilkan gambar/isi dari database bila
           sudah tersedia (kunci opsional donasi_qris di konten_halaman); selama belum ada,
           tampilkan placeholder "[dari database]" — repo tetap kode murni (aturan B). -->
      <div id="qris-donasi">
        <h2>Donasi via QRIS</h2>
        <p>{{donasi_qris}}</p>
      </div>
      <div id="label-transparan" aria-live="polite">
        <h2>Keterangan Penting</h2>
        <p>{{donasi_label}}</p>
      </div>
    </section>
  </main>

  <footer class="situs-footer">
    <div class="lebar">
      <p>© <span id="tahun-kini">2026</span> LAZISNU MWC NU Kecamatan Paninggaran</p>
      <nav aria-label="Navigasi kaki">
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
