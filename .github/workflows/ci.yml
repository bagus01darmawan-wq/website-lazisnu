name: ci-website-lazisnu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Tes QA — ditulis QA-agent (rencana tes 05), dilarang diubah builder (aturan A).
  # Hijau = syarat merge. Saat B0: skrip tes belum dipasang QA-agent, job lulus kosong.
  tes-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # T5: suntik konten Tentang dari database (konten_halaman, baca-saja anon).
      # Repo tetap kode murni (B6): nilai datang dari secret CI, tidak pernah dari commit.
      - name: Suntik konten dari database (T5)
        run: npm run generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Jalankan tes QA bila sudah dipasang
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ADMIN_EMAIL: ${{ secrets.SUPABASE_ADMIN_EMAIL }}
          SUPABASE_ADMIN_PASSWORD: ${{ secrets.SUPABASE_ADMIN_PASSWORD }}
          SUPABASE_ADMIN2_EMAIL: ${{ secrets.SUPABASE_ADMIN2_EMAIL }}
          SUPABASE_ADMIN2_PASSWORD: ${{ secrets.SUPABASE_ADMIN2_PASSWORD }}
        run: |
          TEST_SCRIPT=$(npm pkg get scripts.test 2>/dev/null || true)
          if [ "$TEST_SCRIPT" != "{}" ] && [ -n "$TEST_SCRIPT" ]; then
            echo "Skrip tes ditemukan — menjalankan: npm test"
            npm test
          else
            echo "Fase B0: tes QA belum dipasang oleh QA-agent (failing-first menyusul). Job lulus kosong."
          fi

  # Pemindai rahasia — SEC-02: nol kunci/kredensial di kode maupun riwayat commit. Syarat mutlak.
  # 2026-08-12 (insiden infra): gitleaks/gitleaks-action@v2 (tag mengambang) mulai MEWAJIBKAN
  # lisensi komersial (GITLEAKS_LICENSE) — CI merah tanpa kebocoran. Solusi: image OSS
  # zricethezav/gitleaks (MIT) dipakai langsung via docker, di-pin versi; keluar non-nol
  # bila ada temuan (fail-closed dipertahankan), --redact agar rahasia tak tercetak.
  pemindai-rahasia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gitleaks dijalankan sebagai BINARY di host runner (bukan docker action):
      # (1) gitleaks-action@v2 mewajibkan lisensi komersial sejak 2026-08 (CI merah
      #     tanpa kebocoran); (2) docker container berjalan sebagai user berbeda →
      #     git menolak repo (dubious ownership) dan "no leaks found" jadi HASIL
      #     PALSU (scan kosong). Binary host = user checkout yang sama → riwayat
      #     penuh terpindai; versi di-pin; --exit-code 1 menjaga fail-closed.
      - name: Gitleaks (SEC-02)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  # Build — memastikan kerangka situs utuh.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Periksa kerangka situs
        run: npm run build
